<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>薪資計算與排班預估 Pro</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            padding-bottom: 40px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            margin: 0;
        }
        .currency-btn {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 12px;
            color: #64748b;
        }
        /* 日曆樣式 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }
        .weekday {
            font-size: 12px;
            font-weight: bold;
            color: #94a3b8;
            padding: 4px 0;
        }
        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            font-weight: 500;
        }
        .day:hover { background: #f1f5f9; }
        .day.selected {
            background: var(--primary) !important;
            color: white;
        }
        .day.has-shift::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 4px;
            height: 4px;
            background: #f97316;
            border-radius: 50%;
        }
        .day.selected.has-shift::after {
            background: white;
        }
        .day.other-month {
            color: #cbd5e1;
        }
        /* 表單輸入 */
        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .form-group:last-child { border-bottom: none; }
        label { font-size: 14px; font-weight: 500; }
        input, select {
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
            text-align: right;
            width: 100px;
        }
        /* 按鈕樣式 */
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        /* 明細與總計 */
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }
        .total-row {
            border-top: 2px solid var(--border);
            margin-top: 8px;
            padding-top: 12px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>薪資計算與排班預估</h1>
        <button class="currency-btn" onclick="toggleCurrency()">
            <span id="currency-flag">🇦🇺</span> <span id="currency-code">AUD</span>
        </button>
    </div>

    <!-- 1. 設定區 -->
    <div class="card">
        <div class="section-title">基礎薪資設定</div>
        <div class="form-group">
            <label>基礎時薪 (Base Rate)</label>
            <input type="number" id="base-rate" value="25.00" step="0.1" onchange="calculateSalary()">
        </div>
        <div class="form-group">
            <label>Casual 加給 (%)</label>
            <input type="number" id="casual-loading" value="25" onchange="calculateSalary()">
        </div>
        <div class="form-group">
            <label>背包客預估稅率</label>
            <select id="tax-rate" onchange="calculateSalary()">
                <option value="15" selected>15% (低於 $45k)</option>
                <option value="32.5">32.5% (高於 $45k)</option>
                <option value="0">0% (不扣稅)</option>
            </select>
        </div>
    </div>

    <!-- 2. 日曆選擇 -->
    <div class="card">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)" style="border:none;background:none;cursor:pointer;font-weight:bold;">&lt;</button>
            <span id="calendar-month-year" style="font-weight: bold;">2026年7月</span>
            <button onclick="changeMonth(1)" style="border:none;background:none;cursor:pointer;font-weight:bold;">&gt;</button>
        </div>
        <div class="calendar-grid" id="calendar-grid">
            <!-- 日曆動態渲染 -->
        </div>
    </div>

    <!-- 3. 單日排班設定 -->
    <div class="card">
        <div class="section-title">當日排班操作 (<span id="selected-date-str">請選擇日期</span>)</div>
        <div class="form-group">
            <label>排班類型</label>
            <select id="shift-type" onchange="toggleShiftInputs()">
                <option value="none">放假 / 未排班</option>
                <option value="day">白班 (一般費率)</option>
                <option value="night">夜班 (加成費率)</option>
            </select>
        </div>
        <div id="shift-time-inputs" style="display: none;">
            <div class="form-group">
                <label>上班時間</label>
                <input type="time" id="start-time" value="06:00">
            </div>
            <div class="form-group">
                <label>下班時間</label>
                <input type="time" id="end-time" value="14:30">
            </div>
            <div class="form-group">
                <label>扣除不計薪 Smoko (分鐘)</label>
                <input type="number" id="break-time" value="30">
            </div>
            <div class="form-group">
                <label>夜班津貼加成 (%)</label>
                <input type="number" id="night-loading" value="15">
            </div>
        </div>

        <div class="btn-stack">
            <button class="btn btn-primary" onclick="saveCurrentShift()">確定排入此日期 (單日)</button>
            <div class="btn-group">
                <button class="btn btn-outline" onclick="fillWeek()">一鍵填滿本週</button>
                <button class="btn btn-outline" onclick="clearMonthShifts()">清空本月數據</button>
            </div>
        </div>
    </div>

    <!-- 4. 當月/當週總計預估 -->
    <div class="card">
        <div class="section-title">薪資與工時總計預估</div>
        <div class="summary-row">
            <span>總計薪工時</span>
            <span id="total-hours">0.00 小時</span>
        </div>
        <div class="summary-row">
            <span>稅前總薪資 (Gross)</span>
            <span id="total-gross">$0.00</span>
        </div>
        <div class="summary-row">
            <span>預估扣稅 (Tax)</span>
            <span id="total-tax">-$0.00</span>
        </div>
        <div class="summary-row total-row">
            <span>實領淨薪資 (Net Pay)</span>
            <span id="total-net">$0.00</span>
        </div>
    </div>
</div>

<script>
    // 全域狀態
    let currentCurrency = 'AUD';
    const FX_RATE = 22.63; // AUD 到 TWD 匯率 
    let currentDate = new Date(2026, 6, 20); // 鎖定目前時間 2026 年 7 月
    let selectedDate = new Date(2026, 6, 20);
    
    // 資料結構：儲存格式為 'YYYY-MM-DD': { type, start, end, breakMin, nightLoad }
    let shiftData = JSON.parse(localStorage.getItem('shiftDataPro')) || {};

    function init() {
        renderCalendar();
        selectDate(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
    }

    function toggleCurrency() {
        currentCurrency = currentCurrency === 'AUD' ? 'TWD' : 'AUD';
        document.getElementById('currency-code').innerText = currentCurrency;
        document.getElementById('currency-flag').innerText = currentCurrency === 'AUD' ? '🇦🇺' : '🇹🇼';
        calculateSalary();
    }

    function formatMoney(amount) {
        if (currentCurrency === 'TWD') {
            return 'NT$ ' + Math.round(amount * FX_RATE).toLocaleString();
        }
        return '$' + amount.toFixed(2).toLocaleString();
    }

    function changeMonth(dir) {
        currentDate.setMonth(currentDate.getMonth() + dir);
        renderCalendar();
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        document.getElementById('calendar-month-year').innerText = `${year}年${month + 1}月`;

        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';

        // 星期欄位
        const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        weekdays.forEach(w => {
            const el = document.createElement('div');
            el.className = 'weekday';
            el.innerText = w;
            grid.appendChild(el);
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        // 補空白 (上個月)
        for(let i=0; i<firstDayIndex; i++) {
            const el = document.createElement('div');
            el.className = 'day other-month';
            grid.appendChild(el);
        }

        // 當月日期
        for(let d=1; d<=totalDays; d++) {
            const el = document.createElement('div');
            el.className = 'day';
            el.innerText = d;
            
            const dateStr = formatDateKey(new Date(year, month, d));
            if (shiftData[dateStr] && shiftData[dateStr].type !== 'none') {
                el.classList.add('has-shift');
            }

            if (selectedDate.getFullYear() === year && selectedDate.getMonth() === month && selectedDate.getDate() === d) {
                el.classList.add('selected');
            }

            el.onclick = () => selectDate(year, month, d);
            grid.appendChild(el);
        }
        calculateSalary();
    }

    function formatDateKey(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function selectDate(y, m, d) {
        selectedDate = new Date(y, m, d);
        document.getElementById('selected-date-str').innerText = `${m+1}月${d}日`;
        
        // 重新渲染高亮
        const days = document.querySelectorAll('.day');
        days.forEach(el => el.classList.remove('selected'));
        renderCalendar();

        // 載入當天舊資料
        const dateStr = formatDateKey(selectedDate);
        if (shiftData[dateStr]) {
            document.getElementById('shift-type').value = shiftData[dateStr].type;
            document.getElementById('start-time').value = shiftData[dateStr].start;
            document.getElementById('end-time').value = shiftData[dateStr].end;
            document.getElementById('break-time').value = shiftData[dateStr].breakMin;
            document.getElementById('night-loading').value = shiftData[dateStr].nightLoad || 15;
        } else {
            document.getElementById('shift-type').value = 'none';
        }
        toggleShiftInputs();
    }

    function toggleShiftInputs() {
        const type = document.getElementById('shift-type').value;
        document.getElementById('shift-time-inputs').style.display = type === 'none' ? 'none' : 'block';
    }

    function saveCurrentShift() {
        const dateStr = formatDateKey(selectedDate);
        const type = document.getElementById('shift-type').value;
        
        if(type === 'none') {
            delete shiftData[dateStr];
        } else {
            shiftData[dateStr] = {
                type: type,
                start: document.getElementById('start-time').value,
                end: document.getElementById('end-time').value,
                breakMin: parseInt(document.getElementById('break-time').value) || 0,
                nightLoad: parseInt(document.getElementById('night-loading').value) || 0
            };
        }
        localStorage.setItem('shiftDataPro', JSON.stringify(shiftData));
        renderCalendar();
    }

    // 一鍵填滿當週工作日 (週一至週五)
    function fillWeek() {
        const currentDayOfWeek = selectedDate.getDay(); // 0日 1一 ... 6六
        const mondayOffset = currentDayOfWeek === 0 ? -6 : 1 - currentDayOfWeek;
        
        const type = document.getElementById('shift-type').value;
        if(type === 'none') return alert('請先選擇一個白班或夜班類型再點擊填滿！');

        const template = {
            type: type,
            start: document.getElementById('start-time').value,
            end: document.getElementById('end-time').value,
            breakMin: parseInt(document.getElementById('break-time').value) || 0,
            nightLoad: parseInt(document.getElementById('night-loading').value) || 0
        };

        // 填滿週一到週五
        for(let i=0; i<5; i++) {
            const targetDate = new Date(selectedDate);
            targetDate.setDate(selectedDate.getDate() + mondayOffset + i);
            shiftData[formatDateKey(targetDate)] = { ...template };
        }

        localStorage.setItem('shiftDataPro', JSON.stringify(shiftData));
        renderCalendar();
    }

    function clearMonthShifts() {
        if(confirm('確定要清空所有的排班資料嗎？')) {
            shiftData = {};
            localStorage.removeItem('shiftDataPro');
            renderCalendar();
        }
    }

    function calculateSalary() {
        const base = parseFloat(document.getElementById('base-rate').value) || 0;
        const casual = parseFloat(document.getElementById('casual-loading').value) || 0;
        const taxRate = parseFloat(document.getElementById('tax-rate').value) || 0;

        let totalHours = 0;
        let totalGross = 0;

        // 計算當前顯示月份的所有天數總和
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const totalDays = new Date(year, month + 1, 0).getDate();

        for(let d=1; d<=totalDays; d++) {
            const dateStr = formatDateKey(new Date(year, month, d));
            const shift = shiftData[dateStr];
            
            if(shift && shift.type !== 'none') {
                const [sH, sM] = shift.start.split(':').map(Number);
                let [eH, eM] = shift.end.split(':').map(Number);
                
                // 跨夜處理
                if (eH < sH || (eH === sH && eM < sM)) eH += 24;
                
                let diffHours = (eH * 60 + eM) - (sH * 60 + sM);
                diffHours -= shift.breakMin;
                const hours = Math.max(0, diffHours / 60);
                
                // 算薪水
                let rate = base * (1 + casual / 100);
                if(shift.type === 'night') {
                    rate = rate * (1 + (shift.nightLoad || 15) / 100);
                }
                
                totalHours += hours;
                totalGross += hours * rate;
            }
        }

        const totalTax = totalGross * (taxRate / 100);
        const totalNet = totalGross - totalTax;

        // 更新畫面
        document.getElementById('total-hours').innerText = totalHours.toFixed(2) + ' 小時';
        document.getElementById('total-gross').innerText = formatMoney(totalGross);
        document.getElementById('total-tax').innerText = '-' + formatMoney(totalTax);
        document.getElementById('total-net').innerText = formatMoney(totalNet);
    }

    window.onload = init;
</script>

</body>
</html>
