<script>
    'use strict';

    const STORAGE_KEYS = Object.freeze({
        shifts: 'shiftDataProMax',
        expenses: 'dailyExpensesProMax',
        settings: 'salarySettingsProMax',
        language: 'goalpay_lang',
        currency: 'goalpay_currency'
    });

    const FX_RATE = 22.63;
    const SUPER_RATE = 0.12;
    const NIGHT_LOADING_RATE = 0.15;

    let currentCurrency = 'AUD';
    let currentLang = 'zh';
    let currentDate = new Date();
    let selectedDate = null;
    let isContinuousMode = false;
    let shiftData = {};
    let dailyExpenses = {};

    function getElement(id) {
        return document.getElementById(id);
    }

    function parseNumber(value, fallback = 0) {
        const number = Number.parseFloat(value);
        return Number.isFinite(number) ? number : fallback;
    }

    function parseInteger(value, fallback = 0) {
        const number = Number.parseInt(value, 10);
        return Number.isFinite(number) ? number : fallback;
    }

    function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
    }

    function safeJsonParse(value, fallback) {
        if (!value) return fallback;

        try {
            return JSON.parse(value);
        } catch (error) {
            console.warn('GoalPay 資料解析失敗：', error);
            return fallback;
        }
    }

    function saveToStorage(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
            return true;
        } catch (error) {
            console.error('GoalPay 資料儲存失敗：', error);
            return false;
        }
    }

    function createExpenseId() {
        if (
            typeof crypto !== 'undefined' &&
            typeof crypto.randomUUID === 'function'
        ) {
            return crypto.randomUUID();
        }

        return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function normalizeShiftData(data) {
        if (!data || typeof data !== 'object' || Array.isArray(data)) {
            return {};
        }

        const normalized = {};

        Object.entries(data).forEach(([dateKey, shift]) => {
            if (
                !/^\d{4}-\d{2}-\d{2}$/.test(dateKey) ||
                !shift ||
                typeof shift !== 'object'
            ) {
                return;
            }

            const allowedTypes = ['day', 'night', 'sunday', 'double'];

            if (!allowedTypes.includes(shift.type)) {
                return;
            }

            normalized[dateKey] = {
                type: shift.type,
                start: typeof shift.start === 'string'
                    ? shift.start
                    : '07:00',
                end: typeof shift.end === 'string'
                    ? shift.end
                    : '15:00',
                breakMin: Math.max(
                    0,
                    parseInteger(shift.breakMin, 30)
                )
            };
        });

        return normalized;
    }

    function normalizeExpenseData(data) {
        if (!data || typeof data !== 'object' || Array.isArray(data)) {
            return {};
        }

        const normalized = {};

        Object.entries(data).forEach(([dateKey, expenseValue]) => {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) {
                return;
            }

            let items = expenseValue;

            if (typeof expenseValue === 'number') {
                items = [{
                    id: createExpenseId(),
                    note: '支出',
                    amount: expenseValue
                }];
            }

            if (!Array.isArray(items)) {
                return;
            }

            const validItems = items
                .map(item => {
                    if (!item || typeof item !== 'object') {
                        return null;
                    }

                    const amount = parseNumber(item.amount);

                    if (amount <= 0) {
                        return null;
                    }

                    return {
                        id: item.id !== undefined
                            ? String(item.id)
                            : createExpenseId(),
                        note: String(item.note || '支出').trim() || '支出',
                        amount
                    };
                })
                .filter(Boolean);

            if (validItems.length > 0) {
                normalized[dateKey] = validItems;
            }
        });

        return normalized;
    }

    function init() {
        shiftData = normalizeShiftData(
            safeJsonParse(
                localStorage.getItem(STORAGE_KEYS.shifts),
                {}
            )
        );

        dailyExpenses = normalizeExpenseData(
            safeJsonParse(
                localStorage.getItem(STORAGE_KEYS.expenses),
                {}
            )
        );

        const savedLang = localStorage.getItem(STORAGE_KEYS.language);

        if (savedLang && translations[savedLang]) {
            currentLang = savedLang;
        }

        getElement('lang-select').value = currentLang;

        const savedCurrency = localStorage.getItem(
            STORAGE_KEYS.currency
        );

        if (savedCurrency === 'AUD' || savedCurrency === 'TWD') {
            currentCurrency = savedCurrency;
        }

        loadSettings();
        updateCurrencyUI();
        applyLanguage(false);
        renderCalendar(false);
        deselectDate(false);
        calculateAll();

        getElement('daily-expense-amount')
            .addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    addDailyExpenseItem();
                }
            });

        getElement('daily-expense-note')
            .addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    getElement('daily-expense-amount').focus();
                }
            });
    }

    function forceRefreshApp() {
        const messages = {
            zh: '正在獲取最新版本並重新載入...',
            en: 'Fetching latest version and reloading...',
            ja: '最新バージョンを取得して再読み込み中...',
            ko: '최신 버전을 불러와 새로고침 중...'
        };

        alert(messages[currentLang] || messages.zh);

        const url = new URL(window.location.href);
        url.searchParams.set('v', Date.now().toString());

        window.location.replace(url.toString());
    }

    function changeLanguage(lang) {
        if (!translations[lang]) return;

        currentLang = lang;
        localStorage.setItem(STORAGE_KEYS.language, lang);

        applyLanguage(false);
        renderCalendar(false);
        updateSelectedDateDisplay();
        updateContinuousBtnUI();
        calculateAll();
    }

    function applyLanguage(shouldCalculate = true) {
        const langData = translations[currentLang];

        document.querySelectorAll('[data-i18n]').forEach(element => {
            const key = element.dataset.i18n;

            if (Object.prototype.hasOwnProperty.call(langData, key)) {
                element.innerHTML = langData[key];
            }
        });

        document.querySelectorAll('[data-i18n-ph]').forEach(element => {
            const key = element.dataset.i18nPh;

            if (Object.prototype.hasOwnProperty.call(langData, key)) {
                element.placeholder = langData[key];
            }
        });

        updateContinuousBtnUI();
        updateSelectedDateDisplay();

        if (shouldCalculate) {
            calculateAll();
        }
    }

    function toggleCustomTaxInput() {
        const isCustom = getElement('tax-rate').value === 'custom';

        getElement('custom-tax-container').style.display =
            isCustom ? 'flex' : 'none';
    }

    function getEffectiveTaxRate() {
        const selectedRate = getElement('tax-rate').value;

        if (selectedRate === 'custom') {
            return clamp(
                parseNumber(getElement('custom-tax-val').value),
                0,
                100
            );
        }

        return clamp(parseNumber(selectedRate), 0, 100);
    }

    function getSettings() {
        return {
            baseRate: getElement('base-rate').value,
            casualLoading: getElement('casual-loading').value,
            sundayLoading: getElement('sunday-loading').value,
            doubleLoading: getElement('double-loading').value,
            otThreshold: getElement('ot-threshold').value,
            ppeAllowance: getElement('ppe-allowance').value,
            taxRate: getElement('tax-rate').value,
            customTaxVal: getElement('custom-tax-val').value,
            saveTarget: getElement('save-target').value,
            expRent: getElement('exp-rent').value,
            expGroceries: getElement('exp-groceries').value,
            expTransport: getElement('exp-transport').value,
            expOthers: getElement('exp-others').value
        };
    }

    function applySettings(settings) {
        if (!settings || typeof settings !== 'object') return;

        const fieldMap = {
            baseRate: 'base-rate',
            casualLoading: 'casual-loading',
            sundayLoading: 'sunday-loading',
            doubleLoading: 'double-loading',
            otThreshold: 'ot-threshold',
            ppeAllowance: 'ppe-allowance',
            taxRate: 'tax-rate',
            customTaxVal: 'custom-tax-val',
            saveTarget: 'save-target',
            expRent: 'exp-rent',
            expGroceries: 'exp-groceries',
            expTransport: 'exp-transport',
            expOthers: 'exp-others'
        };

        Object.entries(fieldMap).forEach(([settingKey, elementId]) => {
            if (settings[settingKey] !== undefined) {
                getElement(elementId).value = settings[settingKey];
            }
        });

        toggleCustomTaxInput();
    }

    function saveSettings() {
        saveToStorage(STORAGE_KEYS.settings, getSettings());
        calculateAll();
    }

    function loadSettings() {
        const settings = safeJsonParse(
            localStorage.getItem(STORAGE_KEYS.settings),
            null
        );

        applySettings(settings);
        toggleCustomTaxInput();
    }

    function saveAllData() {
        const settingsSaved = saveToStorage(
            STORAGE_KEYS.settings,
            getSettings()
        );

        const shiftsSaved = saveToStorage(
            STORAGE_KEYS.shifts,
            shiftData
        );

        const expensesSaved = saveToStorage(
            STORAGE_KEYS.expenses,
            dailyExpenses
        );

        localStorage.setItem(
            STORAGE_KEYS.language,
            currentLang
        );

        localStorage.setItem(
            STORAGE_KEYS.currency,
            currentCurrency
        );

        return settingsSaved && shiftsSaved && expensesSaved;
    }

    function manualSaveAll() {
        const success = saveAllData();

        const successMessages = {
            zh: '✅ 所有資料與班表已成功儲存！',
            en: '✅ All data saved!',
            ja: '✅ 保存しました！',
            ko: '✅ 저장되었습니다!'
        };

        const errorMessages = {
            zh: '❌ 儲存失敗，請確認瀏覽器儲存空間是否可用。',
            en: '❌ Save failed. Please check browser storage.',
            ja: '❌ 保存に失敗しました。',
            ko: '❌ 저장에 실패했습니다.'
        };

        alert(
            success
                ? successMessages[currentLang] || successMessages.zh
                : errorMessages[currentLang] || errorMessages.zh
        );

        calculateAll();
    }

    function toggleCurrency() {
        currentCurrency =
            currentCurrency === 'AUD' ? 'TWD' : 'AUD';

        localStorage.setItem(
            STORAGE_KEYS.currency,
            currentCurrency
        );

        updateCurrencyUI();
        calculateAll();
    }

    function updateCurrencyUI() {
        const isAud = currentCurrency === 'AUD';
        const flag = isAud ? '🇦🇺' : '🇹🇼';

        getElement('currency-code').textContent = currentCurrency;
        getElement('currency-flag').textContent = flag;
        getElement('net-box-code').textContent = currentCurrency;
        getElement('net-box-flag').textContent = flag;

        document.querySelectorAll('.curr-txt').forEach(element => {
            element.textContent = currentCurrency;
        });
    }

    function formatMoney(amount) {
        const safeAmount = Number.isFinite(Number(amount))
            ? Number(amount)
            : 0;

        if (currentCurrency === 'TWD') {
            return `NT$ ${Math.round(
                safeAmount * FX_RATE
            ).toLocaleString('zh-TW')}`;
        }

        return `$${safeAmount.toFixed(2)}`;
    }

    function changeMonth(direction) {
        currentDate = new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() + direction,
            1
        );

        renderCalendar();
    }

    function renderCalendar(shouldCalculate = true) {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const monthYearElement = getElement('calendar-month-year');

        if (currentLang === 'zh' || currentLang === 'ja') {
            monthYearElement.textContent =
                `${year}年${month + 1}月`;
        } else if (currentLang === 'ko') {
            monthYearElement.textContent =
                `${year}년 ${month + 1}월`;
        } else {
            monthYearElement.textContent =
                `${month + 1}/${year}`;
        }

        const grid = getElement('calendar-grid');
        const fragment = document.createDocumentFragment();

        grid.innerHTML = '';

        translations[currentLang].weekdays.forEach(weekday => {
            const element = document.createElement('div');
            element.className = 'weekday';
            element.textContent = weekday;
            fragment.appendChild(element);
        });

        const firstDayIndex =
            new Date(year, month, 1).getDay();

        const totalDays =
            new Date(year, month + 1, 0).getDate();

        const today = new Date();

        for (let index = 0; index < firstDayIndex; index++) {
            const element = document.createElement('div');
            element.className = 'day other-month';
            fragment.appendChild(element);
        }

        for (let day = 1; day <= totalDays; day++) {
            const element = document.createElement('div');
            const date = new Date(year, month, day);
            const dateKey = formatDateKey(date);

            element.className = 'day';
            element.textContent = day.toString();

            if (
                year === today.getFullYear() &&
                month === today.getMonth() &&
                day === today.getDate()
            ) {
                element.classList.add('today-highlight');
            }

            if (
                shiftData[dateKey] &&
                shiftData[dateKey].type !== 'none'
            ) {
                element.classList.add('has-shift');
            }

            if (
                selectedDate &&
                selectedDate.getFullYear() === year &&
                selectedDate.getMonth() === month &&
                selectedDate.getDate() === day
            ) {
                element.classList.add('selected');
            }

            element.addEventListener('click', () => {
                selectDate(year, month, day);
            });

            fragment.appendChild(element);
        }

        grid.appendChild(fragment);

        if (shouldCalculate) {
            calculateAll();
        }
    }

    function formatDateKey(date) {
        return [
            date.getFullYear(),
            String(date.getMonth() + 1).padStart(2, '0'),
            String(date.getDate()).padStart(2, '0')
        ].join('-');
    }

    function selectDate(year, month, day) {
        selectedDate = new Date(year, month, day);
        updateSelectedDateDisplay();

        getElement('daily-expense-note').value = '';
        getElement('daily-expense-amount').value = '';

        if (isContinuousMode) {
            saveCurrentShift();
            return;
        }

        const dateKey = formatDateKey(selectedDate);
        const savedShift = shiftData[dateKey];

        if (savedShift) {
            getElement('shift-type').value = savedShift.type;
            getElement('start-time').value =
                savedShift.start || '07:00';
            getElement('end-time').value =
                savedShift.end || '15:00';
            getElement('break-time').value =
                savedShift.breakMin !== undefined
                    ? savedShift.breakMin
                    : 30;
        } else {
            getElement('shift-type').value = 'none';
        }

        toggleShiftInputs();
        renderCalendar();
    }

    function addDailyExpenseItem() {
        if (!selectedDate) {
            const messages = {
                zh: '請先選擇日期！',
                en: 'Please select a date first!',
                ja: '日付を選択してください！',
                ko: '날짜를 먼저 선택하세요!'
            };

            alert(messages[currentLang] || messages.zh);
            return;
        }

        const noteInput = getElement('daily-expense-note');
        const amountInput = getElement('daily-expense-amount');
        const amount = parseNumber(amountInput.value);

        if (amount <= 0) {
            const messages = {
                zh: '請輸入有效的金額！',
                en: 'Please enter a valid amount!',
                ja: '正確な金額を入力してください！',
                ko: '올바른 금액을 입력하세요!'
            };

            alert(messages[currentLang] || messages.zh);
            amountInput.focus();
            return;
        }

        const dateKey = formatDateKey(selectedDate);
        const note = noteInput.value.trim() || '支出';

        if (!Array.isArray(dailyExpenses[dateKey])) {
            dailyExpenses[dateKey] = [];
        }

        dailyExpenses[dateKey].push({
            id: createExpenseId(),
            note,
            amount
        });

        saveToStorage(
            STORAGE_KEYS.expenses,
            dailyExpenses
        );

        noteInput.value = '';
        amountInput.value = '';

        getElement('expense-accordion-content').style.display =
            'block';

        getElement('expense-accordion-arrow').textContent =
            '▲';

        calculateAll();
    }

    function deleteExpenseItem(dateKey, itemId) {
        if (!Array.isArray(dailyExpenses[dateKey])) return;

        const targetId = String(itemId);

        dailyExpenses[dateKey] =
            dailyExpenses[dateKey].filter(item => {
                return String(item.id) !== targetId;
            });

        if (dailyExpenses[dateKey].length === 0) {
            delete dailyExpenses[dateKey];
        }

        saveToStorage(
            STORAGE_KEYS.expenses,
            dailyExpenses
        );

        calculateAll();
    }

    function deselectDate(shouldRender = true) {
        selectedDate = null;

        updateSelectedDateDisplay();

        getElement('shift-type').value = 'none';
        getElement('daily-expense-note').value = '';
        getElement('daily-expense-amount').value = '';

        toggleShiftInputs();

        if (shouldRender) {
            renderCalendar();
        }
    }

    function updateSelectedDateDisplay() {
        const display = getElement('selected-date-str');

        if (!selectedDate) {
            display.textContent =
                translations[currentLang].selectDatePrompt;
            return;
        }

        const month = selectedDate.getMonth() + 1;
        const day = selectedDate.getDate();

        if (currentLang === 'zh' || currentLang === 'ja') {
            display.textContent = `${month}月${day}日`;
        } else if (currentLang === 'ko') {
            display.textContent = `${month}월 ${day}일`;
        } else {
            display.textContent = `${month}/${day}`;
        }
    }

    function toggleContinuousMode() {
        isContinuousMode = !isContinuousMode;
        updateContinuousBtnUI();
    }

    function updateContinuousBtnUI() {
        const button = getElement('btn-continuous');
        const notice = getElement('continuous-notice');

        if (!button || !notice) return;

        if (isContinuousMode) {
            button.classList.add('btn-toggle-active');
            button.textContent =
                translations[currentLang].btnContinuousOn;
            notice.style.display = 'block';
        } else {
            button.classList.remove('btn-toggle-active');
            button.textContent =
                translations[currentLang].btnContinuousOff;
            notice.style.display = 'none';
        }
    }

    function toggleShiftInputs() {
        const shiftType = getElement('shift-type').value;

        getElement('shift-time-inputs').style.display =
            shiftType === 'none' ? 'none' : 'block';
    }

    function saveCurrentShift() {
        if (!selectedDate) {
            const messages = {
                zh: '請先選擇日期！',
                en: 'Please select a date first!',
                ja: '日付を選択してください！',
                ko: '날짜를 먼저 선택하세요!'
            };

            alert(messages[currentLang] || messages.zh);
            return;
        }

        const dateKey = formatDateKey(selectedDate);
        const shiftType = getElement('shift-type').value;

        if (shiftType === 'none') {
            delete shiftData[dateKey];
        } else {
            const startTime = getElement('start-time').value;
            const endTime = getElement('end-time').value;
            const breakMinutes = Math.max(
                0,
                parseInteger(getElement('break-time').value)
            );

            if (!startTime || !endTime) {
                const messages = {
                    zh: '請輸入正確的上下班時間！',
                    en: 'Please enter valid start and end times!',
                    ja: '正しい勤務時間を入力してください！',
                    ko: '올바른 출퇴근 시간을 입력하세요!'
                };

                alert(messages[currentLang] || messages.zh);
                return;
            }

            const hours = calculateShiftHours(
                startTime,
                endTime,
                breakMinutes
            );

            if (hours <= 0) {
                const messages = {
                    zh: '工時必須大於 0 小時，請檢查時間與休息分鐘數。',
                    en: 'Shift hours must be greater than zero.',
                    ja: '勤務時間は0時間より長く設定してください。',
                    ko: '근무 시간은 0시간보다 커야 합니다.'
                };

                alert(messages[currentLang] || messages.zh);
                return;
            }

            shiftData[dateKey] = {
                type: shiftType,
                start: startTime,
                end: endTime,
                breakMin: breakMinutes
            };
        }

        saveToStorage(
            STORAGE_KEYS.shifts,
            shiftData
        );

        renderCalendar();
    }

    function clearMonthShifts() {
        const messages = {
            zh: '確定要清空所有月份的班表與當日支出嗎？薪資與固定支出設定不會被刪除。',
            en: 'Clear all shifts and daily expenses? Pay settings will remain.',
            ja: 'すべてのシフトと当日支出を削除しますか？給与設定は残ります。',
            ko: '모든 근무 일정과 당일 지출을 삭제하시겠습니까? 급여 설정은 유지됩니다.'
        };

        if (!confirm(messages[currentLang] || messages.zh)) {
            return;
        }

        shiftData = {};
        dailyExpenses = {};
        selectedDate = null;

        localStorage.removeItem(STORAGE_KEYS.shifts);
        localStorage.removeItem(STORAGE_KEYS.expenses);

        getElement('shift-type').value = 'none';
        getElement('daily-expense-note').value = '';
        getElement('daily-expense-amount').value = '';

        toggleShiftInputs();
        updateSelectedDateDisplay();
        renderCalendar();
    }

    function getWeekNumber(dateInput) {
        const date = new Date(dateInput.getTime());

        date.setHours(0, 0, 0, 0);
        date.setDate(
            date.getDate() +
            3 -
            ((date.getDay() + 6) % 7)
        );

        const weekOne = new Date(
            date.getFullYear(),
            0,
            4
        );

        return 1 + Math.round(
            (
                (
                    date.getTime() -
                    weekOne.getTime()
                ) / 86400000 -
                3 +
                ((weekOne.getDay() + 6) % 7)
            ) / 7
        );
    }

    function calculateShiftHours(
        startTime,
        endTime,
        breakMinutes
    ) {
        if (!startTime || !endTime) return 0;

        const startParts = startTime.split(':').map(Number);
        const endParts = endTime.split(':').map(Number);

        if (
            startParts.length !== 2 ||
            endParts.length !== 2 ||
            startParts.some(Number.isNaN) ||
            endParts.some(Number.isNaN)
        ) {
            return 0;
        }

        const [startHour, startMinute] = startParts;
        const [endHour, endMinute] = endParts;

        let startTotalMinutes =
            startHour * 60 + startMinute;

        let endTotalMinutes =
            endHour * 60 + endMinute;

        if (endTotalMinutes <= startTotalMinutes) {
            endTotalMinutes += 24 * 60;
        }

        const safeBreakMinutes = Math.max(
            0,
            parseInteger(breakMinutes)
        );

        const workedMinutes =
            endTotalMinutes -
            startTotalMinutes -
            safeBreakMinutes;

        return Math.max(0, workedMinutes / 60);
    }

    function calculateAll() {
        const baseRate = Math.max(
            0,
            parseNumber(getElement('base-rate').value)
        );

        const casualLoading = Math.max(
            0,
            parseNumber(getElement('casual-loading').value)
        );

        const sundayLoading = Math.max(
            0,
            parseNumber(getElement('sunday-loading').value)
        );

        const doubleLoading = Math.max(
            0,
            parseNumber(getElement('double-loading').value)
        );

        const overtimeThreshold = Math.max(
            0,
            parseNumber(getElement('ot-threshold').value)
        );

        const ppeAllowance = Math.max(
            0,
            parseNumber(getElement('ppe-allowance').value)
        );

        const taxRate = getEffectiveTaxRate();

        const savingsTarget = Math.max(
            0,
            parseNumber(getElement('save-target').value)
        );

        const rent = Math.max(
            0,
            parseNumber(getElement('exp-rent').value)
        );

        const groceries = Math.max(
            0,
            parseNumber(getElement('exp-groceries').value)
        );

        const transport = Math.max(
            0,
            parseNumber(getElement('exp-transport').value)
        );

        const others = Math.max(
            0,
            parseNumber(getElement('exp-others').value)
        );

        getElement('summary-tax-rate-label').textContent =
            `${taxRate}%`;

        const shiftsContainer =
            getElement('week-shifts-container');

        const shiftsFragment =
            document.createDocumentFragment();

        shiftsContainer.innerHTML = '';

        let totalWage = 0;
        let totalHours = 0;
        let shiftDaysCount = 0;

        const activeWeeks = new Set();

        const sortedKeys = Object.keys(shiftData)
            .filter(dateKey => {
                const shift = shiftData[dateKey];

                return (
                    shift &&
                    shift.type &&
                    shift.type !== 'none'
                );
            })
            .sort();

        const shiftTypeMap = {
            zh: {
                day: '白班',
                night: '夜班',
                sunday: '星期日',
                double: 'Double班'
            },
            en: {
                day: 'Day Shift',
                night: 'Night Shift',
                sunday: 'Sunday',
                double: 'Double'
            },
            ja: {
                day: '日勤',
                night: '夜勤',
                sunday: '日曜日',
                double: 'Double'
            },
            ko: {
                day: '주간',
                night: '야간',
                sunday: '일요일',
                double: 'Double'
            }
        };

        if (sortedKeys.length > 0) {
            const firstDate = sortedKeys[0];
            const lastDate =
                sortedKeys[sortedKeys.length - 1];

            getElement('summary-date-range').textContent =
                `${firstDate} ～ ${lastDate} (${sortedKeys.length}天)`;
        } else {
            getElement('summary-date-range').textContent =
                translations[currentLang].noShifts;
        }

        sortedKeys.forEach(dateKey => {
            const shift = shiftData[dateKey];
            const date = new Date(`${dateKey}T00:00:00`);

            if (Number.isNaN(date.getTime())) return;

            shiftDaysCount += 1;

            const weekKey =
                `${date.getFullYear()}-W${getWeekNumber(date)}`;

            activeWeeks.add(weekKey);

            const hours = calculateShiftHours(
                shift.start,
                shift.end,
                shift.breakMin
            );

            totalHours += hours;

            let hourlyRate =
                baseRate * (1 + casualLoading / 100);

            if (shift.type === 'night') {
                hourlyRate *= 1 + NIGHT_LOADING_RATE;
            } else if (shift.type === 'sunday') {
                hourlyRate =
                    baseRate * (1 + sundayLoading / 100);
            } else if (shift.type === 'double') {
                hourlyRate =
                    baseRate * (1 + doubleLoading / 100);
            }

            let dayWage;

            if (
                overtimeThreshold > 0 &&
                hours > overtimeThreshold
            ) {
                const regularHours = overtimeThreshold;
                const overtimeHours =
                    hours - overtimeThreshold;

                dayWage =
                    regularHours * hourlyRate +
                    overtimeHours * hourlyRate * 1.5;
            } else {
                dayWage = hours * hourlyRate;
            }

            totalWage += dayWage;

            const item = document.createElement('div');
            const left = document.createElement('span');
            const right = document.createElement('span');
            const strong = document.createElement('strong');

            item.className = 'shift-item';

            const dayName =
                translations[currentLang]
                    .weekdays[date.getDay()];

            const typeName =
                shiftTypeMap[currentLang][shift.type] ||
                shift.type;

            left.textContent =
                `${date.getMonth() + 1}/${date.getDate()} ` +
                `(${dayName}) - ${typeName}`;

            strong.textContent = formatMoney(dayWage);

            right.append(
                `${hours.toFixed(2)}hrs / `,
                strong
            );

            item.append(left, right);
            shiftsFragment.appendChild(item);
        });

        getElement('shift-summary-count').textContent =
            `(${shiftDaysCount}天 / ${totalHours.toFixed(2)}hrs)`;

        if (shiftDaysCount === 0) {
            shiftsContainer.innerHTML =
                `<div class="empty-text">` +
                `${translations[currentLang].emptyShiftMsg}` +
                `</div>`;
        } else {
            shiftsContainer.appendChild(shiftsFragment);
        }

        renderFixedExpenseList(
            activeWeeks.size,
            rent,
            groceries,
            transport,
            others
        );

        const totalDailyExpenses =
            renderDailyExpenseList();

        const totalWeeksCount =
            Math.max(1, activeWeeks.size);

        const weeklyFixedExpenses =
            rent + groceries + transport + others;

        const totalFixedExpenses =
            weeklyFixedExpenses * totalWeeksCount;

        const totalExpenses =
            totalFixedExpenses + totalDailyExpenses;

        const totalPpe =
            activeWeeks.size * ppeAllowance;

        const grossPay =
            totalWage + totalPpe;

        const taxAmount =
            grossPay * (taxRate / 100);

        const netPay =
            grossPay - taxAmount;

        const superAmount =
            totalWage * SUPER_RATE;

        const finalSavings =
            netPay - totalExpenses;

        getElement('summary-wage-subtotal').textContent =
            formatMoney(totalWage);

        getElement('summary-ppe').textContent =
            formatMoney(totalPpe);

        getElement('summary-gross').textContent =
            formatMoney(grossPay);

        getElement('summary-tax').textContent =
            `-${formatMoney(taxAmount)}`;

        getElement('summary-net').textContent =
            formatMoney(netPay);

        getElement('summary-super').textContent =
            formatMoney(superAmount);

        getElement('summary-total-expenses').textContent =
            `-${formatMoney(totalExpenses)}`;

        getElement('summary-savings-remains').textContent =
            formatMoney(finalSavings);

        updateSavingsProgress(
            finalSavings,
            savingsTarget
        );

        updateBackupData();
    }

    function updateSavingsProgress(
        finalSavings,
        savingsTarget
    ) {
        const progressBar = getElement('progress-bar');
        const progressPercent =
            getElement('progress-percent');
        const progressText =
            getElement('progress-bar-text');

        if (savingsTarget <= 0) {
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
            progressText.textContent =
                translations[currentLang].goalUnset;
            return;
        }

        const percentage = clamp(
            finalSavings / savingsTarget * 100,
            0,
            100
        );

        progressBar.style.width = `${percentage}%`;
        progressPercent.textContent =
            `${percentage.toFixed(1)}%`;

        if (finalSavings >= savingsTarget) {
            progressText.textContent =
                translations[currentLang].goalCongrats;
        } else {
            progressText.textContent =
                translations[currentLang].goalRemaining +
                formatMoney(
                    savingsTarget - finalSavings
                );
        }
    }

    function renderFixedExpenseList(
        weeksCount,
        rent,
        groceries,
        transport,
        others
    ) {
        const container =
            getElement('fixed-expense-container');

        const summary =
            getElement('fixed-expense-summary-count');

        const weeklyTotal =
            rent + groceries + transport + others;

        const totalWeeks =
            Math.max(1, weeksCount);

        const grandTotal =
            weeklyTotal * totalWeeks;

        container.innerHTML = '';

        summary.textContent =
            `(${totalWeeks}週 / ${formatMoney(grandTotal)})`;

        if (weeklyTotal <= 0) {
            container.innerHTML =
                `<div class="empty-text">` +
                `${translations[currentLang].emptyFixedExpenseMsg}` +
                `</div>`;
            return;
        }

        const items = [
            {
                label: translations[currentLang].lblExpRent,
                amount: rent
            },
            {
                label: translations[currentLang].lblExpGroceries,
                amount: groceries
            },
            {
                label: translations[currentLang].lblExpTransport,
                amount: transport
            },
            {
                label: translations[currentLang].lblExpOthers,
                amount: others
            }
        ];

        const fragment =
            document.createDocumentFragment();

        items.forEach(item => {
            if (item.amount <= 0) return;

            const row = document.createElement('div');
            const left = document.createElement('span');
            const right = document.createElement('span');
            const weeklyStrong =
                document.createElement('strong');
            const totalStrong =
                document.createElement('strong');

            row.className = 'shift-item';

            left.textContent = `${item.label} (每週)`;

            weeklyStrong.textContent =
                formatMoney(item.amount);

            totalStrong.textContent =
                formatMoney(item.amount * totalWeeks);

            right.append(
                weeklyStrong,
                ` × ${totalWeeks}週 = `,
                totalStrong
            );

            row.append(left, right);
            fragment.appendChild(row);
        });

        container.appendChild(fragment);
    }

    function renderDailyExpenseList() {
        const container =
            getElement('daily-expense-container');

        const summary =
            getElement('expense-summary-count');

        const allDates =
            Object.keys(dailyExpenses).sort();

        let totalAmount = 0;
        let totalCount = 0;

        container.innerHTML = '';

        allDates.forEach(dateKey => {
            const items = Array.isArray(
                dailyExpenses[dateKey]
            )
                ? dailyExpenses[dateKey]
                : [];

            totalCount += items.length;

            items.forEach(item => {
                totalAmount += parseNumber(item.amount);
            });
        });

        summary.textContent =
            `(${totalCount}筆 / ${formatMoney(totalAmount)})`;

        if (totalCount === 0) {
            container.innerHTML =
                `<div class="empty-text">` +
                `${translations[currentLang].emptyExpenseMsg}` +
                `</div>`;

            return 0;
        }

        const fragment =
            document.createDocumentFragment();

        allDates.forEach(dateKey => {
            const items = Array.isArray(
                dailyExpenses[dateKey]
            )
                ? dailyExpenses[dateKey]
                : [];

            const date = new Date(`${dateKey}T00:00:00`);

            if (Number.isNaN(date.getTime())) return;

            const dateLabel =
                `${date.getMonth() + 1}月${date.getDate()}日`;

            items.forEach(item => {
                const row =
                    document.createElement('div');

                const left =
                    document.createElement('div');

                const right =
                    document.createElement('div');

                const dateTag =
                    document.createElement('span');

                const note =
                    document.createElement('strong');

                const amount =
                    document.createElement('span');

                const deleteButton =
                    document.createElement('button');

                row.className = 'expense-item';
                dateTag.className = 'expense-date-tag';
                deleteButton.className = 'btn-del-expense';

                dateTag.textContent = dateLabel;
                note.textContent = item.note;
                amount.textContent =
                    formatMoney(parseNumber(item.amount));

                amount.style.fontWeight = 'bold';
                amount.style.marginRight = '8px';

                deleteButton.type = 'button';
                deleteButton.textContent = '🗑️';
                deleteButton.title = '刪除';

                deleteButton.addEventListener('click', () => {
                    deleteExpenseItem(
                        dateKey,
                        String(item.id)
                    );
                });

                left.append(dateTag, note);
                right.append(amount, deleteButton);
                row.append(left, right);
                fragment.appendChild(row);
            });
        });

        container.appendChild(fragment);

        return totalAmount;
    }

    function setAccordionState(
        contentId,
        arrowId,
        shouldOpen
    ) {
        const content = getElement(contentId);
        const arrow = getElement(arrowId);

        content.style.display =
            shouldOpen ? 'block' : 'none';

        arrow.textContent =
            shouldOpen ? '▲' : '▼';
    }

    function toggleAccordionById(contentId, arrowId) {
        const content = getElement(contentId);
        const isOpen =
            content.style.display === 'block';

        setAccordionState(
            contentId,
            arrowId,
            !isOpen
        );
    }

    function toggleFixedExpenseAccordion() {
        toggleAccordionById(
            'fixed-expense-accordion-content',
            'fixed-expense-accordion-arrow'
        );
    }

    function toggleExpenseAccordion() {
        toggleAccordionById(
            'expense-accordion-content',
            'expense-accordion-arrow'
        );
    }

    function toggleShiftAccordion() {
        toggleAccordionById(
            'shift-accordion-content',
            'shift-accordion-arrow'
        );
    }

    function toggleAccordion() {
        toggleAccordionById(
            'accordion-content',
            'accordion-arrow'
        );
    }

    function encodeBackupData(data) {
        const json = JSON.stringify(data);
        const bytes = new TextEncoder().encode(json);

        let binary = '';

        bytes.forEach(byte => {
            binary += String.fromCharCode(byte);
        });

        return btoa(binary);
    }

    function decodeBackupData(encodedData) {
        const binary = atob(encodedData.trim());

        const bytes = Uint8Array.from(
            binary,
            character => character.charCodeAt(0)
        );

        return JSON.parse(
            new TextDecoder().decode(bytes)
        );
    }

    function updateBackupData() {
        const backupPayload = {
            version: 2,
            exportedAt: new Date().toISOString(),
            shifts: shiftData,
            expenses: dailyExpenses,
            settings: getSettings(),
            language: currentLang,
            currency: currentCurrency
        };

        try {
            getElement('backup-data').value =
                encodeBackupData(backupPayload);
        } catch (error) {
            console.error('建立備份資料失敗：', error);
            getElement('backup-data').value = '';
        }
    }

    async function copyBackup() {
        const textArea = getElement('backup-data');

        if (!textArea.value) {
            updateBackupData();
        }

        try {
            await navigator.clipboard.writeText(
                textArea.value
            );

            const messages = {
                zh: '✅ 已複製備份文字！',
                en: '✅ Copied to clipboard!',
                ja: '✅ コピーしました！',
                ko: '✅ 복사되었습니다!'
            };

            alert(messages[currentLang] || messages.zh);
        } catch (error) {
            textArea.removeAttribute('readonly');
            textArea.select();
            textArea.setSelectionRange(
                0,
                textArea.value.length
            );

            const copied =
                document.execCommand('copy');

            textArea.setAttribute('readonly', '');

            alert(
                copied
                    ? 'Copied / 已複製'
                    : 'Copy failed / 複製失敗'
            );
        }
    }

    function importData() {
        const backupText = prompt(
            'Paste backup text / 請貼入備份字串：'
        );

        if (!backupText || !backupText.trim()) {
            return;
        }

        try {
            let parsed;

            try {
                parsed = decodeBackupData(backupText);
            } catch (modernDecodeError) {
                parsed = JSON.parse(
                    decodeURIComponent(atob(backupText.trim()))
                );
            }

            if (!parsed || typeof parsed !== 'object') {
                throw new Error('Invalid backup format');
            }

            if (
                Object.prototype.hasOwnProperty.call(
                    parsed,
                    'shifts'
                )
            ) {
                shiftData = normalizeShiftData(
                    parsed.shifts || {}
                );

                dailyExpenses = normalizeExpenseData(
                    parsed.expenses || {}
                );

                if (
                    parsed.settings &&
                    typeof parsed.settings === 'object'
                ) {
                    applySettings(parsed.settings);
                }

                if (
                    parsed.language &&
                    translations[parsed.language]
                ) {
                    currentLang = parsed.language;
                    getElement('lang-select').value =
                        currentLang;
                }

                if (
                    parsed.currency === 'AUD' ||
                    parsed.currency === 'TWD'
                ) {
                    currentCurrency = parsed.currency;
                }
            } else {
                shiftData = normalizeShiftData(parsed);
            }

            saveAllData();
            updateCurrencyUI();
            applyLanguage(false);
            toggleCustomTaxInput();
            deselectDate(false);
            renderCalendar(false);
            calculateAll();

            alert('Restored / 還原成功！');
        } catch (error) {
            console.error('備份匯入失敗：', error);
            alert('Failed / 格式錯誤');
        }
    }

    function escapeCsvCell(value) {
        const text = String(value ?? '');

        return `"${text.replace(/"/g, '""')}"`;
    }

    function exportToCSV() {
        const sortedKeys = Object.keys(shiftData)
            .filter(dateKey => {
                const shift = shiftData[dateKey];

                return (
                    shift &&
                    shift.type &&
                    shift.type !== 'none'
                );
            })
            .sort();

        if (sortedKeys.length === 0) {
            alert(translations[currentLang].noShifts);
            return;
        }

        const rows = [
            [
                'Date',
                'Type',
                'Start Time',
                'End Time',
                'Break (Mins)',
                'Hours'
            ]
        ];

        sortedKeys.forEach(dateKey => {
            const shift = shiftData[dateKey];

            const hours = calculateShiftHours(
                shift.start,
                shift.end,
                shift.breakMin
            );

            rows.push([
                dateKey,
                shift.type,
                shift.start,
                shift.end,
                shift.breakMin,
                hours.toFixed(2)
            ]);
        });

        const csvContent =
            '\uFEFF' +
            rows
                .map(row => {
                    return row
                        .map(escapeCsvCell)
                        .join(',');
                })
                .join('\r\n');

        const blob = new Blob(
            [csvContent],
            {
                type: 'text/csv;charset=utf-8;'
            }
        );

        const objectUrl =
            URL.createObjectURL(blob);

        const link =
            document.createElement('a');

        link.href = objectUrl;
        link.download =
            `GoalPay_Shifts_` +
            `${new Date().toISOString().slice(0, 10)}.csv`;

        document.body.appendChild(link);
        link.click();
        link.remove();

        window.setTimeout(() => {
            URL.revokeObjectURL(objectUrl);
        }, 1000);
    }

    document.addEventListener(
        'DOMContentLoaded',
        init,
        { once: true }
    );
</script>
