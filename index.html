<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薪資與財務預估系統</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; margin: 0; padding: 16px; color: #333; }
        .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h3 { margin-top: 0; font-size: 16px; color: #111; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #444; }
        .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; background: #fff; }
        button { padding: 10px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #ff7f27; color: white; }
        .btn-green { background: #10b981; color: white; width: 100%; }
        .btn-sm { padding: 6px 12px; font-size: 12px; white-space: nowrap; background: #ff7f27; color: white; border-radius: 6px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .summary-box { background: #ecfdf5; border: 1px solid #10b981; border-radius: 12px; padding: 12px; margin-top: 12px; }
    </style>
</head>
<body>

    <!-- 預估開銷與固定支出 -->
    <div class="card">
        <h3>💸 預估開銷支出紀錄</h3>
        
        <div class="form-group">
            <label>每週預估房租</label>
            <div class="row">
                <input type="number" id="rentVal" value="220">
                <button class="btn-sm" onclick="addFixedExpense('每週預估房租', document.getElementById('rentVal').value)">+ 新增</button>
            </div>
        </div>

        <div class="form-group">
            <label>食材與生活物質</label>
            <div class="row">
                <input type="number" id="foodVal" value="0">
                <button class="btn-sm" onclick="addFixedExpense('食材與生活物質', document.getElementById('foodVal').value)">+ 新增</button>
            </div>
        </div>

        <div class="form-group">
            <label>交通油錢支出</label>
            <div class="row">
                <input type="number" id="transportVal" value="0">
                <button class="btn-sm" onclick="addFixedExpense('交通油錢支出', document.getElementById('transportVal').value)">+ 新增</button>
            </div>
        </div>

        <div class="form-group">
            <label>其他娛樂與雜支</label>
            <div class="row">
                <input type="number" id="otherVal" value="0">
                <button class="btn-sm" onclick="addFixedExpense('其他娛樂與雜支', document.getElementById('otherVal').value)">+ 新增</button>
            </div>
        </div>
    </div>

    <!-- 薪資與財務預估總結 -->
    <div class="card">
        <h3>📊 薪資與財務預估總結</h3>
        
        <div class="form-group">
            <label>統計區間：每週</label>
            <select id="weeklySelect" onchange="updateWeeklyView()">
                <option value="all">所有總計 (All Weeks)</option>
                <option value="w1">7/6 - 7/12 (稅後: $926.85)</option>
                <option value="w2">7/13 - 7/19 (稅後: $926.85)</option>
                <option value="w3">7/20 - 7/26 (稅後: $926.85)</option>
            </select>
        </div>

        <!-- 2026年當月總收入（年份/月份下拉式） -->
        <div class="form-group">
            <label>📅 2026年當月總收入查詢</label>
            <div class="row">
                <select id="yearSelect">
                    <option value="2026" selected>2026 年</option>
                </select>
                <select id="monthSelect">
                    <option value="7" selected>7 月</option>
                    <option value="8">8 月</option>
                    <option value="9">9 月</option>
                </select>
            </div>
            <div style="font-size: 14px; font-weight: bold; color: #10b981; margin-top: 6px;">
                當月預估總收入：$3,707.40 AUD
            </div>
        </div>

        <div class="summary-box">
            <div style="font-size: 13px; color: #047857;">當週實領預估總計 (稅後淨所得)</div>
            <div style="font-size: 22px; font-weight: bold; color: #047857;" id="weeklyTotalDisplay">$2,780.56 AUD</div>
        </div>
    </div>

    <!-- 固定支出明細清單 -->
    <div class="card">
        <h3>📋 固定支出明細紀錄</h3>
        <div id="expenseList" style="font-size: 14px; color: #666;">目前尚無新增項目</div>
    </div>

    <script>
        let fixedExpenses = JSON.parse(localStorage.getItem('fixedExpenses')) || [];

        function renderExpenses() {
            const container = document.getElementById('expenseList');
            if (fixedExpenses.length === 0) {
                container.innerHTML = '目前尚無新增項目';
                return;
            }
            let html = '';
            fixedExpenses.forEach((item, index) => {
                html += `<div class="flex-between" style="padding: 8px 0; border-bottom: 1px solid #eee;">
                    <span>${item.name}</span>
                    <span>$${item.amount} <button onclick="removeExpense(${index})" style="background:#ef4444; color:white; border:none; padding:2px 6px; border-radius:4px; margin-left:8px; cursor:pointer;">刪除</button></span>
                </div>`;
            });
            container.innerHTML = html;
            localStorage.setItem('fixedExpenses', JSON.stringify(fixedExpenses));
        }

        function addFixedExpense(name, amount) {
            if (amount <= 0) {
                alert('請輸入大於 0 的金額');
                return;
            }
            fixedExpenses.push({ name, amount });
            renderExpenses();
            alert(`已成功新增：${name} ($${amount})`);
        }

        function removeExpense(index) {
            fixedExpenses.splice(index, 1);
            renderExpenses();
        }

        function updateWeeklyView() {
            const val = document.getElementById('weeklySelect').value;
            const display = document.getElementById('weeklyTotalDisplay');
            if (val === 'all') {
                display.innerText = '$2,780.56 AUD';
            } else {
                display.innerText = '$926.85 AUD';
            }
        }

        // 初始化載入
        renderExpenses();
    </script>
</body>
</html>
