<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="GoalPay">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <title>GoalPay - 薪資理財與排班預估 Pro Max</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --green-bg: #f0fdf4;
            --green-text: #166534;
            --green-border: #bbf7d0;
            --orange: #f97316;
            --red: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: 60px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; margin-top: 10px; }
        h1 { font-size: 18px; margin: 0; }
        
        .header-controls { display: flex; align-items: center; gap: 6px; }
        
        .lang-select {
            background: #ffffff; border: 1px solid var(--border); padding: 6px 8px;
            border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; outline: none;
            color: var(--text);
        }

        .currency-btn {
            background: #ffffff; border: 1px solid var(--border); padding: 6px 12px;
            border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 4px;
        }
        
        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 16px; }
        .section-title { font-size: 15px; font-weight: bold; margin-top: 0; margin-bottom: 12px; color: #475569; display: flex; align-items: center; gap: 6px; }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .weekday { font-size: 12px; font-weight: bold; color: #94a3b8; padding: 4px 0; }
        .day { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; font-size: 14px; border-radius: 8px; cursor: pointer; position: relative; font-weight: 500; }
        .day:hover { background: #f1f5f9; }
        .day.selected { background: var(--primary) !important; color: white; }
        .day.has-shift::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; background: var(--orange); border-radius: 50%; }
        .day.selected.has-shift::after { background: white; }
        .day.other-month { color: #cbd5e1; }

        .continuous-notice {
            background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; font-size: 12px;
            padding: 6px 10px; border-radius: 8px; margin-bottom: 10px; text-align: center; font-weight: bold; display: none;
        }

        .form-group { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
        .form-group:last-child { border-bottom: none; }
        label { font-size: 14px; font-weight: 500; }
        input, select { border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; font-size: 14px; text-align: right; width: 130px; box-sizing: border-box; }
        
        .progress-container { background: #e2e8f0; border-radius: 8px; height: 16px; width: 100%; margin: 8px 0; overflow: hidden; position: relative; }
        .progress-bar { background: linear-gradient(90deg, #22c55e, #10b981); height: 100%; width: 0%; transition: width 0.3s ease; }
        .progress-text { position: absolute; right: 8px; top: 0; font-size: 11px; font-weight: bold; color: #475569; line-height: 16px; }

        .btn-stack { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-save { background: #16a34a; color: white; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-toggle-active { background: #dbeafe; border: 2px solid var(--primary); color: var(--primary); }

        .empty-text { color: #94a3b8; text-align: center; padding: 20px 0; font-size: 14px; line-height: 1.6; }
        .shift-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e2e8f0; font-size: 14px; }
        
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
        .total-row { border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 8px; font-weight: 500; }
        
        .net-pay-box { background: var(--green-bg); border: 1px solid var(--green-border); border-radius: 12px; padding: 12px; margin-top: 12px; color: var(--green-text); }
        .net-pay-title { font-size: 13px; font-weight: bold; margin-bottom: 6px; }
        .net-pay-amount { font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
        
        .accordion-header { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #fff; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .accordion-content { display: none; padding: 12px; background: #fff; border: 1px solid var(--border); border-top: none; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
        textarea { width: 100%; height: 80px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; box-sizing: border-box; font-size: 12px; margin-bottom: 8px; }
        
        .date-range-badge { background: #e0f2fe; color: #0369a1; font-size: 12px; padding: 4px 8px; border-radius: 6px; margin-bottom: 12px; font-weight: 600; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 data-i18n="appTitle">GoalPay 薪資與排班預估</h1>
        <div class="header-controls">
            <select id="lang-select" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="zh">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
            </select>

            <button class="currency-btn" onclick="toggleCurrency()">
                <span id="currency-flag">🇦🇺</span> <span id="currency-code">AUD</span>
            </button>
        </div>
    </div>

    <div class="card">
        <div class="section-title" data-i18n="secSalary">薪資與津貼設定</div>
        <div class="form-group">
            <label data-i18n="lblBaseRate">基礎時薪 (Base Rate)</label>
            <input type="number" id="base-rate" placeholder="0" value="" step="0.1" onchange="saveSettings()">
        </div>
        <div class="form-group">
            <label data-i18n="lblCasual">Casual 加給 (%)</label>
            <select id="casual-loading" onchange="saveSettings()">
                <option value="25" selected data-i18n="optCasual25">25% (政府標準)</option>
                <option value="20" data-i18n="optCasual20">20% (特殊條款)</option>
                <option value="0" data-i18n="optCasual0">0% (正職/無加給)</option>
            </select>
        </div>
        <div class="form-group">
            <label data-i18n="lblSunday">星期日加成率 (%)</label>
            <input type="number" id="sunday-loading" placeholder="0" value="" onchange="saveSettings()">
        </div>
        <div class="form-group">
            <label data-i18n="lblDouble">Double 雙倍薪資 (%)</label>
            <input type="number" id="double-loading" placeholder="0" value="" onchange="saveSettings()">
        </div>
        <div class="form-group">
            <label data-i18n="lblPpe">PPE 工具每週津貼</label>
            <input type="number" id="ppe-allowance" placeholder="0" value="" step="0.5" onchange="saveSettings()">
        </div>
        <div class="form-group">
            <label data-i18n="lblTax">預估扣稅扣繳</label>
            <select id="tax-rate" onchange="saveSettings()">
                <option value="15" selected data-i18n="optTax15">15% (背包客低於45k)</option>
                <option value="32.5" data-i18n="optTax325">32.5% (超過45k)</option>
                <option value="12" data-i18n="optTax12">12% (自訂舊稅率)</option>
                <option value="0" data-i18n="optTax0">0% (不扣稅)</option>
            </select>
        </div>
    </div>

    <div class="card">
        <div class="section-title" data-i18n="secGoal">🎯 存錢目標與支出記帳</div>
        <div class="form-group">
            <label style="color: #059669; font-weight: bold;" data-i18n="lblSaveTarget">設定存錢目標金額</label>
            <input type="number" id="save-target" placeholder="0" value="" step="100" onchange="saveSettings()">
        </div>
        <div style="margin: 10px 0 6px 0; font-size: 13px; font-weight: bold; color: #475569;" data-i18n="secExpHead">💸 每週預估固定開銷 (Weekly)</div>
        <div class="form-group">
            <label data-i18n="lblExpRent">每週預估房租</label>
            <input type="number" id="exp-rent" placeholder="0" value="" step="10" onchange="saveSettings()">
        </div>
        <div class="form-group">
            <label data-i18n="lblExpGroceries">食材與生活物資 (每週)</label>
            <input type="number" id="exp-groceries" placeholder="0" value="" step="10" onchange="saveSettings()">
        </div>
        <div class="form-group">
            <label data-i18n="lblExpTransport">交通油錢支出 (每週)</label>
            <input type="number" id="exp-transport" placeholder="0" value="" step="5" onchange="saveSettings()">
        </div>
        <div class="form-group">
            <label data-i18n="lblExpOthers">其他娛樂與雜支 (每週)</label>
            <input type="number" id="exp-others" placeholder="0" value="" step="5" onchange="saveSettings()">
        </div>
    </div>

    <div class="card">
        <div id="continuous-notice" class="continuous-notice" data-i18n="msgContinuousActive">
            ⚡ 連續新增模式開啟中：點擊日曆日期即可直接套用排班設定！
        </div>
        <div class="calendar-header">
            <button onclick="changeMonth(-1)" style="border:none;background:none;cursor:pointer;font-weight:bold;">&lt;</button>
            <span id="calendar-month-year" style="font-weight: bold;">2026年7月</span>
            <button onclick="changeMonth(1)" style="border:none;background:none;cursor:pointer;font-weight:bold;">&gt;</button>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
    </div>

    <div class="card">
        <div class="section-title"><span data-i18n="secShiftOp">當日排班與記帳操作</span> (<span id="selected-date-str">未選擇日期</span>)</div>
        <div class="form-group">
            <label data-i18n="lblShiftType">排班類型</label>
            <select id="shift-type" onchange="toggleShiftInputs()">
                <option value="none" data-i18n="optShiftNone">放假 / 未排班</option>
                <option value="day" data-i18n="optShiftDay">白班 (一般費率)</option>
                <option value="night" data-i18n="optShiftNight">夜班 (加成費率)</option>
                <option value="sunday" data-i18n="optShiftSunday">星期日班表</option>
                <option value="double" data-i18n="optShiftDouble">國定假日 Double</option>
            </select>
        </div>
        <div id="shift-time-inputs" style="display: none;">
            <div class="form-group">
                <label data-i18n="lblStartTime">上班時間</label>
                <input type="time" id="start-time" value="07:00">
            </div>
            <div class="form-group">
                <label data-i18n="lblEndTime">下班時間</label>
                <input type="time" id="end-time" value="
